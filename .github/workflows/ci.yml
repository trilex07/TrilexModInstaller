name: Installer regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: python scripts/audit-source.py
      - shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-build-and-evidence
          path: |
            artifacts/publish/
            artifacts/test-fixtures/test-report.json
            artifacts/ui-smoke/
            artifacts/portable-smoke/
