name: Publish signed installer RC
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable RC tag (for example installer-0.1.0-rc.1)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: Require production signatures and create signed catalog
        shell: pwsh
        env:
          PUBLISHER_KEY: ${{ secrets.CATALOG_PRIVATE_KEY_PEM }}
          CERTIFICATE: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          if(!$env:PUBLISHER_KEY -or !$env:CERTIFICATE -or !$env:CERT_PASSWORD){throw 'Production catalog and Authenticode signing secrets required'}
          $key=Join-Path $env:RUNNER_TEMP 'publisher.pem'
          $cert=Join-Path $env:RUNNER_TEMP 'publisher.pfx'
          try {
            [IO.File]::WriteAllText($key,$env:PUBLISHER_KEY)
            [IO.File]::WriteAllBytes($cert,[Convert]::FromBase64String($env:CERTIFICATE))
            dotnet run --project src/Trilex.Installer.Tools -c Release --no-build -- sign catalog/catalog.json $key artifacts/publish/catalog.signed.json
            if($LASTEXITCODE){throw 'Catalog signing failed'}
            dotnet run --project src/Trilex.Installer.Tools -c Release --no-build -- verify artifacts/publish/catalog.signed.json catalog/trusted-publisher.pem
            if($LASTEXITCODE){throw 'Signing key does not match embedded trust pin'}
            $sdk=Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Directory | Sort-Object Name -Descending | Select-Object -First 1
            $tool=Join-Path $sdk.FullName 'x64/signtool.exe'
            & $tool sign /fd SHA256 /f $cert /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 artifacts/publish/TrilexModInstaller.exe
            if($LASTEXITCODE){throw 'Authenticode signing failed'}
            & $tool verify /pa artifacts/publish/TrilexModInstaller.exe
            if($LASTEXITCODE){throw 'Authenticode verification failed'}
            $sha=(Get-FileHash artifacts/publish/TrilexModInstaller.exe).Hash
            "$sha  TrilexModInstaller.exe" | Set-Content artifacts/publish/SHA256SUMS.txt -Encoding utf8NoBOM
          } finally {
            Remove-Item -LiteralPath $key,$cert -ErrorAction SilentlyContinue
          }
      - name: Draft release only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if($env:TAG -notmatch '^installer-[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'){throw 'Explicit immutable installer RC tag required'}
          $env:NUGET_PACKAGES=Join-Path $PWD '.build/nuget'
          ./scripts/package-portable.ps1
          gh release create $env:TAG artifacts/publish/TrilexModInstaller-win-x64.zip artifacts/publish/ZIP-SHA256SUMS.txt artifacts/publish/catalog.signed.json --draft --prerelease --target $env:GITHUB_SHA --title "Trilex Mod Installer $env:TAG" --notes-file docs/RELEASE-NOTES.md
          if($LASTEXITCODE){throw 'Release upload failed'}
